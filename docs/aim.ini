# Mira da teia: de onde ela sai e pra onde aponta.
# Fica na pasta do Spidy (ao lado do "Spidy Launcher.exe").
# Depois de editar, mude qualquer opção no menu SPIDY VR do jogo (ou reinicie o jogo) pra valer.

# Inclina a mira pra cima (positivo) ou pra baixo (negativo), em graus. De -90 a 90.
# Se a teia vai mais alto do que teu pulso aponta, diminua; se vai mais baixo, aumente.
pitch = 0

# Abre a mira pra fora do corpo (positivo) ou fecha pra dentro (negativo), em graus.
# Vale espelhado: a mão esquerda abre pra esquerda, a direita pra direita.
yaw = 0

# Quantos centímetros atrás do centro da mão fica o pulso (de onde a teia sai). De -10 a 30.
wrist_back_cm = 8
